services:
  web:
    # Shoreline's ports on the shared OCS server: Flask 8550, socket server 8551.
    # Image names are Shoreline-specific so they don't overwrite other students' images.
    image: shoreline_flask
    build: .
    env_file:
      - .env # This file is optional; defaults will be used if it does not exist
    ports:
      - "8550:8550"
    volumes:
      - ./instance:/app/instance
    restart: unless-stopped

  socketio:
    image: shoreline_socket
    build: ./socket
    ports:
      - "8551:8500"   # host 8551 -> socket server's 8500 inside the container
    restart: unless-stopped

  code_runner:
    image: shoreline_runner
    build: ./runner
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 128
    restart: unless-stopped
