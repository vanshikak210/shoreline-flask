# nginx site for the Shoreline backend on the OCS server.
# Install: sudo cp nginx_shoreline.conf /etc/nginx/sites-available/shoreline
#          (replace YOUR-DOMAIN below first), then follow DEPLOY_SHORELINE.md.
#
# CORS is handled by Flask (__init__.py allowed_origins, with credentials), so this
# file only proxies. Adding Access-Control-* headers here too would send them twice,
# and browsers reject duplicated CORS headers.
server {
    listen 80;
    listen [::]:80;
    server_name YOUR-DOMAIN;

    # Socket.IO (realtime) -> socket server on 8551
    location /socket.io/ {
        proxy_pass http://localhost:8551;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Everything else -> Flask on 8550
    location / {
        proxy_pass http://localhost:8550;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 6M;
    }
}
